# Render Blueprint — deploys the combined frontend+backend image (deploy/Dockerfile)
# as one free Web Service, backed by a free Render Postgres database.
#
# Render's free Postgres is deleted after 30 days. Fine for a temporary demo;
# for longer-lived hosting, swap DATABASE_URL for a free Neon/Supabase Postgres
# instead (see the deploy notes in CLAUDE.md / README).
databases:
  - name: project-tracking-db
    databaseName: project_tracking
    plan: free

services:
  - type: web
    name: project-tracking
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: project-tracking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
