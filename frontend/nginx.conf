server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to the backend, mirroring the Vite dev proxy — the
    # browser only ever talks to this one origin, so the backend's CORS
    # allowlist never even comes into play for normal use.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # React Router client-side routing — unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
